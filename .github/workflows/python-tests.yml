# Runs the Python test suite on every change to the agent, the desktop app, the
# # tests or their requirements. Triggers: push (limited to those paths), pull
# # requests and manual dispatch. This is the fast gate that must stay green.

name: python-tests

on:
  push:
    paths: [ "agent/**", "desktop/**", "tests/**", "requirements*.txt", ".github/workflows/python-tests.yml" ]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
