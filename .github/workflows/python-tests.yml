name: python-tests

on:
  push:
    paths: [ "agent/**", "tests/**", "requirements*.txt", ".github/workflows/python-tests.yml" ]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
