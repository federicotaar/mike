name: Publish reviewed desktop preview
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8e2625267b828dd215f781b3f96d6dd171c2f3bf
      - name: Download tested preview artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41917757935
          path: packages
          merge-multiple: true
      - name: Verify package inventory
        run: |
          set -euo pipefail
          test -s packages/Mike-Ubuntu-amd64.deb
          test -s packages/Mike-Windows.zip
          test -s packages/Mike-macOS.zip
          (cd packages && sha256sum Mike-* > SHA256SUMS.txt)
      - name: Publish approved preview without replacing old assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view desktop-v0.1.0-preview.1 >/dev/null 2>&1; then
            echo 'Release already exists. Refusing overwrite.'; exit 1
          fi
          cat > /tmp/notes.md <<'NOTES'
          First desktop preview for Ubuntu, Windows and macOS. Binaries are unchanged tested artifacts from commit 8e2625267b828dd215f781b3f96d6dd171c2f3bf (run41917757935); the release tag also includes later documentation and publication-only workflow changes. Chat with your own Groq key, session-only conversation context, manually saved facts and pause/resume.

          Each native build passed 52 Python tests, a native GUI smoke test and a packaged-executable GUI launch check. No live-provider chat or user-computer test was performed.

          - Ubuntu amd64: install the .deb (built on Ubuntu22.04).
          - Windows x64: unzip and run Mike/Mike.exe. Keep its folder together.
          - macOS: unzip Mike.app (single-architecture build; check compatibility before use). Not universal, signed or notarized.

          All builds are unsigned previews. No local inference, reminder tools, sync, automatic updates or always-on agent. Keys are session-only, not saved. Saved facts are sent to Groq with chat; account terms apply, no fallback provider is used. Uninstall preserves the user-data folder. See docs/desktop.md at this tag for details.
          NOTES
          gh release create desktop-v0.1.0-preview.1 packages/Mike-Ubuntu-amd64.deb packages/Mike-Windows.zip packages/Mike-macOS.zip packages/SHA256SUMS.txt --target main --title 'Mike Desktop 0.1.0 Preview 1' --notes-file /tmp/notes.md --prerelease --latest=false
