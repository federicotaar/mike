name: watch-tests

on:
  push:
    paths: [ "mike-watch/**", ".github/workflows/watch-tests.yml" ]
  pull_request:
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: mike-watch
