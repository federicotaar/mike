name: desktop-preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller pillow
      - run: python -m pytest tests -q
      - name: Linux GUI smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m desktop.smoke
      - name: Native GUI smoke
        if: runner.os != 'Linux'
        run: python -m desktop.smoke
      - name: Package preview
        run: python packaging/build_desktop.py
      - name: Linux packaged GUI smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/smoke_frozen.py
      - name: Native packaged GUI smoke
        if: runner.os != 'Linux'
        run: python packaging/smoke_frozen.py
      - uses: actions/upload-artifact@v4
        with:
          name: Mike-${{ runner.os }}-preview
          path: |
            dist/Mike-*.deb
            dist/Mike-*.zip
          retention-days: 14
